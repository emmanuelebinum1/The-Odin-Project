<!DOCTYPE html>
<html lang="en">

<head>
    <script type="module" src="RockPaperScissors.js"></script>
    <link rel="stylesheet" href="frontend.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="button-div">
            <button class="newGame-btn"> New game </button>
        </div>
        <div class="game-interface">
            <div class="Player1">
                <div class="para">
                    <p> choose your fighter</p>
                </div>
                <div class="items">
                    <div class="Rock-Player1">

                        <button class="Rock-btn"> Rock </button>
                    </div>
                    <div class="Paper-Player1">
                        <button class="Paper-btn"> Paper </button>
                    </div>
                    <div class="Scissors-Player1">
                        <button class="Scissors-btn"> Scissors</button>
                    </div>
                </div>
            </div>
            <div class="Computer">
                <div class="Rock-computer">

                </div>
                <div class="Paper-computer">

                </div>
                <div class="Scissors-computer">

                </div>
            </div>
        </div>
        <div class="choices"></div>
        <div class="scoreboard"></div>
        <div class="message"></div>
    </div>

</body>

</html>
